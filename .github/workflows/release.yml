name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0); created if it doesn't exist"
        required: true
        default: "v0.1.0"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel and sdist
        run: |
          python -m pip install --quiet build
          python -m build

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          # On workflow_dispatch the tag doesn't exist yet; --target makes
          # gh create it from the commit this workflow ran on.
          gh release create "$TAG" dist/* \
            --target "$GITHUB_SHA" \
            --title "Riff $TAG" \
            --notes-file .github/release-notes.md
