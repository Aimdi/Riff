name: Weekly dependency bump

on:
  schedule:
    - cron: "15 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgirepository1.0-dev gir1.2-gtk-4.0 gir1.2-adw-1 \
            libmpv2 gtk4 libadwaita-1-0 pkg-config libcairo2-dev \
            python3-gi xvfb

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Bump yt-dlp and ytmusicapi
        run: |
          uv python install 3.12
          uv lock --upgrade-package yt-dlp --upgrade-package ytmusicapi
          uv sync --all-extras --group dev
          uv pip install -e ".[dev]"

      - name: Run tests
        run: xvfb-run -a uv run pytest -q --cov=riff/core --cov-fail-under=60

      - name: Open PR if lockfile changed
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore(deps): bump yt-dlp and ytmusicapi"
          title: "chore(deps): weekly yt-dlp / ytmusicapi bump"
          body: |
            Automated weekly bump of the fragile YouTube stack (`yt-dlp`, `ytmusicapi`).
            CI tests must pass before merge.
          branch: chore/deps-yt-weekly
          delete-branch: true
